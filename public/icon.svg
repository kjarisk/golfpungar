<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Golfpungar">
  <!-- Rounded green badge — matches the login logo. -->
  <rect width="512" height="512" rx="96" fill="#16a34a"/>
  <!-- Soft turf shadows beneath each ball -->
  <ellipse cx="162" cy="384" rx="74" ry="10" fill="rgba(0,0,0,0.22)"/>
  <ellipse cx="350" cy="384" rx="74" ry="10" fill="rgba(0,0,0,0.22)"/>
  <!-- The pungar — two golf balls -->
  <circle cx="162" cy="290" r="88" fill="white"/>
  <circle cx="350" cy="290" r="88" fill="white"/>
  <!-- Putting-line stripe across each ball — the classic alignment mark -->
  <line x1="98"  y1="290" x2="226" y2="290" stroke="rgba(0,0,0,0.16)" stroke-width="6" stroke-linecap="round"/>
  <line x1="286" y1="290" x2="414" y2="290" stroke="rgba(0,0,0,0.16)" stroke-width="6" stroke-linecap="round"/>
</svg>
